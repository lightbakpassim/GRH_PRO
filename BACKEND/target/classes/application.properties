# Serveur
server.port=${SERVER_PORT:8080}

# Base de données (surcharger via variables d'environnement)
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/gestionRH?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# JWT
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS (origines front séparées par des virgules)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

# Comptes de test au démarrage (admin@grh.tg / dg@grh.tg) — false en prod
app.seed-test-users=${SEED_TEST_USERS:true}

# Mail SMTP (identifiants employé à la création)
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${spring.mail.username:noreply@grh.local}}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.paie.heures-mensuelles=${PAIE_HEURES_MENSUELLES:173.33}
app.paie.taux-hs=${PAIE_TAUX_HS:1.25}
app.paie.heures-par-jour=${PAIE_HEURES_PAR_JOUR:8}

